<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
  <style>
    @media only screen and (max-width: 620px) {
      .email-wrapper { padding: 20px 10px !important; }
      .email-inner { width: 100% !important; border-radius: 8px !important; }
      .header-cell { padding: 24px 20px !important; }
      .header-title { font-size: 18px !important; }
      .header-sub { font-size: 12px !important; }
      .body-cell { padding: 24px 20px !important; }
      .sender-avatar { width: 40px !important; height: 40px !important; font-size: 18px !important; line-height: 40px !important; }
      .sender-name { font-size: 16px !important; }
      .message-text { font-size: 14px !important; }
      .footer-cell { padding: 16px 20px !important; }
      .footer-text { font-size: 11px !important; }
    }
    @media only screen and (max-width: 480px) {
      .header-cell { padding: 20px 16px !important; }
      .header-title { font-size: 16px !important; }
      .body-cell { padding: 20px 16px !important; }
      .sender-avatar { width: 36px !important; height: 36px !important; font-size: 16px !important; line-height: 36px !important; }
      .sender-name { font-size: 15px !important; }
      .sender-email { font-size: 12px !important; }
      .message-text { font-size: 13px !important; line-height: 1.6 !important; }
      .footer-cell { padding: 14px 16px !important; }
      .label-text { font-size: 10px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f6;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="email-wrapper" style="background-color:#f4f4f6;padding:40px 20px;">
    <tr>
      <td align="center">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" align="center"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="email-inner" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
          <!-- Header -->
          <tr>
            <td class="header-cell" style="background:linear-gradient(135deg,#6366f1,#06b6d4);padding:32px 40px;text-align:center;">
              <h1 class="header-title" style="margin:0;color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.3px;">New Message Received</h1>
              <p class="header-sub" style="margin:8px 0 0;color:rgba(255,255,255,0.8);font-size:14px;font-weight:400;">Portfolio Contact Form</p>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td class="body-cell" style="padding:36px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <!-- Sender Info -->
                <tr>
                  <td style="padding-bottom:24px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="width:48px;height:48px;background:#eef2ff;border-radius:10px;text-align:center;vertical-align:middle;font-size:22px;line-height:48px;" class="sender-avatar" valign="middle" align="center">&#x1F464;</td>
                        <td style="padding-left:16px;">
                          <div class="label-text" style="color:#64748b;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.8px;">Sender</div>
                          <div class="sender-name" style="color:#0f172a;font-size:18px;font-weight:700;margin-top:2px;word-break:break-word;">{{name}}</div>
                          <div class="sender-email" style="color:#6366f1;font-size:13px;font-weight:500;word-break:break-word;">{{email}}</div>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <!-- Divider -->
                <tr>
                  <td style="border-bottom:1px solid #e2e8f0;padding-bottom:24px;"></td>
                </tr>
                <!-- Message -->
                <tr>
                  <td style="padding:24px 0;">
                    <div class="label-text" style="color:#64748b;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;">Message</div>
                    <div class="message-text" style="color:#1e293b;font-size:15px;line-height:1.7;word-break:break-word;white-space:pre-wrap;">{{message}}</div>
                  </td>
                </tr>
                <!-- Divider -->
                <tr>
                  <td style="border-bottom:1px solid #e2e8f0;padding-bottom:24px;"></td>
                </tr>
                <!-- Footer Info -->
                <tr>
                  <td style="padding-top:20px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td class="footer-cell" style="background:#f8fafc;padding:20px 40px;text-align:center;border-top:1px solid #e2e8f0;">
              <p class="footer-text" style="margin:0;color:#94a3b8;font-size:12px;">
                This message was sent from the portfolio contact form.<br>
                Please respond to <strong style="color:#6366f1;">{{email}}</strong> directly.
              </p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
